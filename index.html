<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Final Sudamericana</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#player {
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<div id="player"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let player;

// Hora de inicio: 14:45 Ecuador
const START_HOUR = 14;
const START_MINUTE = 45;

function getTargetSecond() {

    const now = new Date();

    const start = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        START_HOUR,
        START_MINUTE,
        0
    );

    return Math.floor((now - start) / 1000);
}

function onYouTubeIframeAPIReady() {

    player = new YT.Player('player', {
        videoId: '_GXcnKfDN-g',

        playerVars: {
            autoplay: 1,
            controls: 1,
            rel: 0,
            modestbranding: 1,
            playsinline: 1
        },

        events: {
            onReady: onPlayerReady
        }
    });
}

function onPlayerReady() {

    sync();

    setInterval(sync, 5000);
}

function sync() {

    const target = getTargetSecond();

    if (target < 0) {
        return;
    }

    const current = player.getCurrentTime();

    if (Math.abs(current - target) > 3) {
        player.seekTo(target, true);
    }

    try {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
    } catch (e) {}
}
</script>

</body>
</html>
