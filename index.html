<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transmisión de Partido</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: black; overflow: hidden; color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; text-align: center; 
        }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        
        /* Estilos de la sala de espera */
        #pantallaEspera { display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 4vw; margin-bottom: 10px; color: #cbd5e1; }
        #cuentaRegresiva { font-size: 8vw; font-weight: bold; color: #10b981; }
        .mensaje { font-size: 2vw; color: #64748b; margin-top: 20px; }
    </style>
</head>
<body>
    
    <!-- Pantalla que se muestra antes del partido -->
    <div id="pantallaEspera">
        <h1>La transmisión en vivo comienza en:</h1>
        <div id="cuentaRegresiva">Calculando...</div>
        <div class="mensaje">Toma asiento, el partido se sincronizará automáticamente.</div>
    </div>

    <!-- El reproductor de video -->
    <video id="tvChannel" preload="auto">
        <source src="https://objectstorage.us-ashburn-1.oraclecloud.com/n/idsnhb2bf1vi/b/bucket-20261028-1356/o/partido.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('tvChannel');
        const pantallaEspera = document.getElementById('pantallaEspera');
        const textoCuenta = document.getElementById('cuentaRegresiva');

        // 🔴 AQUÍ CONFIGURAS LA HORA EXACTA DEL ESTRENO 🔴
        // Formato: AAAA-MM-DDTHH:MM:00-05:00 (-05:00 es la zona horaria exacta de Ecuador)
        const horaEstreno = new Date("2026-10-28T14:45:00-05:00").getTime();

        let reproduccionIniciada = false;

        function sincronizarCanal() {
            const ahora = Date.now();
            const diferenciaSegundos = Math.floor((horaEstreno - ahora) / 1000);

            if (diferenciaSegundos > 0) {
                // Aún no es la hora: Mostrar cuenta regresiva (Horas, Minutos, Segundos)
                const horas = Math.floor(diferenciaSegundos / 3600);
                const minutos = Math.floor((diferenciaSegundos % 3600) / 60);
                const segundos = diferenciaSegundos % 60;
                
                let textoTimer = "";
                if (horas > 0) textoTimer += `${horas}h `;
                textoTimer += `${minutos}m ${segundos}s`;
                
                textoCuenta.innerText = textoTimer;
            } else {
                // Ya pasó la hora de estreno: Iniciar el partido
                if (!reproduccionIniciada) {
                    pantallaEspera.style.display = 'none';
                    video.style.display = 'block';
                    reproduccionIniciada = true;
                }

                if (video.duration) {
                    // Calcula cuántos segundos han pasado desde las 14:45
                    const tiempoTranscurrido = Math.floor((ahora - horaEstreno) / 1000);
                    
                    // Con el %, si el partido dura 2 horas y alguien entra a las 3 horas, el video vuelve a empezar (Canal 24/7)
                    const segundoExacto = tiempoTranscurrido % video.duration;

                    // Si el video de un jugador se desfasa por más de 3 segundos (por lag del servidor o carga), lo corrige forzosamente
                    if (Math.abs(video.currentTime - segundoExacto) > 3) {
                        video.currentTime = segundoExacto;
                    }

                    // Forzar reproducción
                    if (video.paused) {
                        video.play().catch(() => {
                            // En Minecraft a veces pide silenciar el primer click
                            video.muted = true;
                            video.play();
                        });
                    }
                }
            }
        }

        // Ejecutar el reloj interno cada 1 segundo (1000 ms)
        setInterval(sincronizarCanal, 1000);
    </script>
</body>
</html>
