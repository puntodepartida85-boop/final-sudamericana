<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Final Sudamericana</title>

<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
}

#player{
    position:fixed;
    inset:0;
}

#blocker{
    position:fixed;
    inset:0;
    z-index:9999;
}
</style>
</head>
<body>

<div id="player"></div>
<div id="blocker"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const VIDEO_ID = "_GXcnKfDN-g";

/*
14:45 Ecuador = UTC-5

Ejemplo para hoy:
28 Oct 2026 14:45 Ecuador
=
28 Oct 2026 19:45 UTC
*/
const START = new Date("2026-10-28T19:45:00Z").getTime();

let player;
let duration = 0;

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {
        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            rel: 0,
            modestbranding: 1,
            iv_load_policy: 3,
            fs: 0
        },

        events: {
            onReady: onReady
        }
    });
}

function getTargetTime() {

    const elapsed =
        Math.floor((Date.now() - START) / 1000);

    return Math.max(0, elapsed);
}

function syncPlayer() {

    if (!player || !duration) return;

    const target = getTargetTime();

    if (target < 0) return;

    const current = player.getCurrentTime();

    if (Math.abs(current - target) > 3) {
        player.seekTo(target, true);
    }

    try {
        player.unMute();
        player.setVolume(100);
        player.playVideo();
    } catch(e){}
}

function onReady() {

    duration = player.getDuration();

    syncPlayer();

    setInterval(syncPlayer, 5000);
}
</script>

</body>
</html>
