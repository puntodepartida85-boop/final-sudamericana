<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Transmisión de Partido - Oficial</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: black; overflow: hidden; color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; text-align: center; 
        }
        video { width: 100%; height: 100%; object-fit: contain; display: none; }
        
        /* Sala de espera */
        #pantallaEspera { display: flex; flex-direction: column; align-items: center; }
        h1 { font-size: 4vw; margin-bottom: 10px; color: #cbd5e1; }
        #cuentaRegresiva { font-size: 8vw; font-weight: bold; color: #10b981; }
        .mensaje { font-size: 2vw; color: #64748b; margin-top: 20px; }
        
        /* Botones de Audio */
        .btn-audio {
            padding: 15px 40px; font-size: 2vw; background-color: #ef4444; 
            color: white; border: none; border-radius: 12px; cursor: pointer; 
            font-weight: bold; transition: 0.3s; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
        .btn-audio:hover { background-color: #dc2626; }
        .btn-audio.activado { background-color: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }

        /* Botón flotante para los que entran tarde (Abajo a la izquierda) */
        #btnAudioFlotante {
            position: absolute; bottom: 30px; left: 30px; z-index: 50; 
            display: none; padding: 15px 30px; font-size: 1.8vw;
            animation: palpitar 2s infinite;
        }

        @keyframes palpitar {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    
    <div id="pantallaEspera">
        <h1>La transmisión en vivo comienza en:</h1>
        <div id="cuentaRegresiva">Calculando...</div>
        <div class="mensaje">Toma asiento, el partido se sincronizará automáticamente.</div>
        <button id="btnAudioEspera" class="btn-audio" style="margin-top: 30px;" onclick="activarAudio()">🔇 Haz clic aquí para activar el sonido</button>
    </div>

    <!-- Botón salvavidas para los que entran tarde -->
    <button id="btnAudioFlotante" class="btn-audio" onclick="activarAudio()">🔇 Clic para activar Sonido</button>

    <video id="tvChannel" preload="auto">
        <source src="https://objectstorage.us-ashburn-1.oraclecloud.com/n/idsnhb2bf1vi/b/bucket-20261028-1356/o/partido.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('tvChannel');
        const pantallaEspera = document.getElementById('pantallaEspera');
        const textoCuenta = document.getElementById('cuentaRegresiva');
        const btnAudioEspera = document.getElementById('btnAudioEspera');
        const btnAudioFlotante = document.getElementById('btnAudioFlotante');

        // 🔴 HORA OFICIAL: 14:45 de Ecuador 🔴
        const horaEstreno = new Date("2026-10-28T14:45:00-05:00").getTime();

        let reproduccionIniciada = false;

        function activarAudio() {
            video.muted = false;
            video.volume = 1.0; // Fuerza el volumen al 100%
            
            // Actualiza la UI de ambos botones
            btnAudioEspera.innerText = "🔊 Sonido Activado y Listo";
            btnAudioEspera.classList.add("activado");
            btnAudioFlotante.style.display = "none";
        }

        function sincronizarCanal() {
            const ahora = Date.now();
            const diferenciaSegundos = Math.floor((horaEstreno - ahora) / 1000);

            if (diferenciaSegundos > 0) {
                // Cuenta regresiva
                const horas = Math.floor(diferenciaSegundos / 3600);
                const minutos = Math.floor((diferenciaSegundos % 3600) / 60);
                const segundos = diferenciaSegundos % 60;
                
                let textoTimer = "";
                if (horas > 0) textoTimer += `${horas}h `;
                textoTimer += `${minutos}m ${segundos}s`;
                textoCuenta.innerText = textoTimer;
            } else {
                // Modo transmisión
                if (!reproduccionIniciada) {
                    pantallaEspera.style.display = 'none';
                    video.style.display = 'block';
                    reproduccionIniciada = true;
                }

                if (video.duration) {
                    const tiempoTranscurrido = Math.floor((ahora - horaEstreno) / 1000);
                    const segundoExacto = tiempoTranscurrido % video.duration;

                    // Ajuste fino para mantener a todos en el mismo segundo
                    if (Math.abs(video.currentTime - segundoExacto) > 3) {
                        video.currentTime = segundoExacto;
                    }

                    if (video.paused) {
                        video.play().catch(() => {
                            video.muted = true;
                            video.play();
                        });
                    }

                    // EL RADAR: Si el video ya está rodando pero está silenciado, muestra el botón flotante
                    if (reproduccionIniciada && video.muted) {
                        btnAudioFlotante.style.display = "block";
                    } else {
                        btnAudioFlotante.style.display = "none";
                    }
                }
            }
        }

        setInterval(sincronizarCanal, 1000);
    </script>
</body>
</html>
